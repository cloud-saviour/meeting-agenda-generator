<!-- Meeting Details -->
<div class="mb-4">
  <div class="section-title">Meeting Details</div>
  <div class="row g-2">
    <div class="col-4">
      <label class="form-label small mb-1">Meeting Number</label>
      <input class="form-control form-control-sm" type="number" [value]="m.no" (input)="update('no', $any($event.target).value)">
    </div>
    <div class="col-4">
      <label class="form-label small mb-1">Meeting Date</label>
      <input class="form-control form-control-sm" type="date" [value]="m.date" [min]="todayStr"
        [class.is-invalid]="dateError" title="Meeting date can't be in the past"
        (input)="updateDate($any($event.target).value)">
      @if (dateError) {
        <div class="text-danger small mt-1">{{ dateError }}</div>
      }
    </div>
    <div class="col-4">
      <label class="form-label small mb-1">Arrival Time</label>
      <input class="form-control form-control-sm" type="time" [value]="m.arr" (input)="update('arr', $any($event.target).value)">
    </div>
    <div class="col-4">
      <label class="form-label small mb-1">Start Time</label>
      <input class="form-control form-control-sm" type="time" [value]="m.st" (input)="update('st', $any($event.target).value)">
    </div>
    <div class="col-4">
      <label class="form-label small mb-1">Meeting Theme</label>
      <input class="form-control form-control-sm" type="text" [value]="m.theme" placeholder="e.g. April Fool's Day" (input)="update('theme', $any($event.target).value)">
    </div>
    <div class="col-4">
      <label class="form-label small mb-1">Word of the Day</label>
      <input class="form-control form-control-sm" type="text" [value]="m.word" placeholder="e.g. Expedient" (input)="update('word', $any($event.target).value)">
    </div>
  </div>
</div>

<!-- Meeting Notes -->
<div class="mb-4">
  <div class="section-title">Meeting Notes</div>
  <div class="row g-2">
    <div class="col-6">
      <label class="form-label small mb-1">Hot Seat</label>
      <input class="form-control form-control-sm" type="text" [value]="m.hotSeat" placeholder="Name" (input)="update('hotSeat', $any($event.target).value)">
    </div>
    <div class="col-6">
      <label class="form-label small mb-1">Reserve Speaker</label>
      <input class="form-control form-control-sm" type="text" [value]="m.reserve" placeholder="Name" (input)="update('reserve', $any($event.target).value)">
    </div>
    <div class="col-12">
      <label class="form-label small mb-1">Apologies</label>
      <input class="form-control form-control-sm" type="text" [value]="m.apologies" placeholder="Name(s)" (input)="update('apologies', $any($event.target).value)">
    </div>
  </div>
</div>

<!-- Club details (name, address, logos, ...) are edited once for the whole club on the Club Settings page -->
<div class="mb-4">
  <div class="section-title">Club and meeting contact</div>
  <p class="small text-muted mb-2">
    The club's name, address, mission and logos are set on the
    <a [routerLink]="'/admin/club' | clubLink">Club Settings</a> page.
  </p>
  <button type="button" class="btn btn-outline-secondary mb-3" (click)="state.applyClubDetails()"
    title="Copies the club's current name, address, mission, website, Facebook and logos into this agenda">
    Use the latest club details
  </button>
  <div class="mb-2">
    <label class="form-label small mb-1">Mission Contact VPE name</label>
    <input class="form-control form-control-sm" type="text" [value]="m.vpe" (input)="update('vpe', $any($event.target).value)">
  </div>
  <div class="mb-2">
    <label class="form-label small mb-1">Committee Period</label>
    <input class="form-control form-control-sm" type="text" [value]="m.period" (input)="update('period', $any($event.target).value)">
  </div>
</div>
