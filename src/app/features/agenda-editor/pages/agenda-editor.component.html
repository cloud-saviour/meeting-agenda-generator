<div class="d-flex flex-column vh-100 app-shell">

  <!-- APP BAR -->
  <app-navbar title="Agora Agenda Planner" [printHidden]="true" [links]="navLinks">
    <button class="btn btn-sm" [class.btn-danger]="isDirty" [class.btn-outline-light]="!isDirty"
      [disabled]="saving || !state.meeting().no"
      [title]="!state.meeting().no ? 'Set a meeting number before saving' : ''"
      (click)="save()">
      {{ saving ? 'Saving…' : isDirty ? '💾 Save*' : justSaved ? '✓ Saved' : '💾 Save' }}
    </button>
    <button class="btn btn-outline-light btn-sm" (click)="newAgenda()" title="Start a new agenda — you'll be asked to confirm if the current one has unsaved changes">
      🆕 New Agenda
    </button>
    <a class="btn btn-outline-light btn-sm" routerLink="/admin/agendas">📋 My Agendas</a>
    <button class="btn btn-outline-light btn-sm" (click)="saveJSON()">&#128190; Export JSON</button>
    <button class="btn btn-outline-light btn-sm" (click)="loadJSON()">&#128193; Import JSON</button>
    <button class="btn btn-word btn-sm" [disabled]="docxBusy" (click)="generateDocx()">
      {{ docxBusy ? 'Building…' : '⬇ DOCX' }}
    </button>
    <button class="btn btn-danger btn-sm" (click)="printAgenda()">&#128438; Print / PDF</button>
    @if (isLivePublished) {
      <span class="badge bg-success-subtle text-success-emphasis align-self-center"
        title="This meeting is currently published — edits here reach /preview and check-in live, no publish step needed">
        ● Live
      </span>
    }
    <a class="btn btn-outline-light btn-sm" routerLink="/admin/manage-roles">⚙ Manage Roles</a>
    @if (isLivePublished) {
      <button class="btn btn-outline-light btn-sm" (click)="copyCheckinLink()">
        {{ linkCopied ? '✓ Copied!' : '🔗 Share Check-in Link' }}
      </button>
    }
    <button class="btn btn-outline-light btn-sm d-md-none" (click)="toggleMobilePreview()">
      {{ mobilePreviewMode ? '✎ Edit Form' : '👁 Preview Agenda' }}
    </button>
  </app-navbar>

  <div class="row g-0 flex-grow-1 app-body" style="min-height:0;"
    [class.mobile-preview]="mobilePreviewMode" [class.mobile-form]="!mobilePreviewMode">

    <!-- FORM PANEL -->
    <div class="col-12 bg-white border-end overflow-auto d-print-none app-sidebar" style="min-height:0;">
      <div class="p-3 pb-4">
        <app-meeting-form></app-meeting-form>
        <app-agenda-items (roleOverrideChanged)="onRoleOverrideChanged($event)"></app-agenda-items>
        <app-speakers-form></app-speakers-form>
      </div>
    </div>

    <!-- PREVIEW PANEL -->
    <div class="col-12 bg-body-secondary overflow-auto d-flex justify-content-center align-items-start p-4 app-preview" style="min-height:0;">
      <app-agenda-preview></app-agenda-preview>
    </div>

  </div>

</div>

<input type="file" id="jf" accept=".json" class="d-none" (change)="onImportJSON($event)">
