<app-navbar title="Edit Club" [fixed]="true"
  [links]="[
    { label: '🏢 All Clubs', path: '/platform/clubs' },
    { label: '🏠 Home', path: '/' }
  ]">
</app-navbar>

<div class="container py-4" style="max-width:640px;">
  @if (loading()) {
    <p class="text-muted small">Loading…</p>
  } @else if (notFound()) {
    <div class="alert alert-warning small">No club with that address. <a routerLink="/platform/clubs">Back to all clubs</a></div>
  } @else if (club(); as c) {
    <app-club-details-form [club]="c" [showActive]="true" [saving]="saving()" [saved]="saved()" [error]="error()"
      backPath="/platform/clubs" (submitted)="save($event)"></app-club-details-form>
  } @else if (error()) {
    <div class="alert alert-danger small">{{ error() }}</div>
  }
</div>
