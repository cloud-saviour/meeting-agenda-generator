<app-navbar title="Create account" [fixed]="true"
  [links]="[
    { label: '🔑 Sign in', path: '/login' },
    { label: '🏠 Home', path: '/' }
  ]">
</app-navbar>

<div class="d-flex flex-column align-items-center justify-content-center bg-body-secondary px-3 py-4" style="min-height:100vh;">
  <div class="card p-4 shadow-sm" style="max-width:440px;width:100%;">
    <div class="text-center mb-3">
      <img src="logo.png" alt="Agora" height="56" class="mb-2">
      <h1 class="fs-4 fw-bold mb-0">Create your account</h1>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold" for="su-name">Your name</label>
      <input id="su-name" class="form-control form-control-lg" type="text" [(ngModel)]="displayName" name="displayName"
        (keydown.enter)="submit()" autocomplete="name" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold" for="su-email">Email address</label>
      <input id="su-email" class="form-control form-control-lg" type="email" [(ngModel)]="email" name="email"
        (keydown.enter)="submit()" autocomplete="username" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold" for="su-password">Choose a password</label>
      <input id="su-password" class="form-control form-control-lg" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password"
        (keydown.enter)="submit()" autocomplete="new-password" aria-describedby="su-password-hint" required>
      <div id="su-password-hint" class="form-text">Use at least 6 characters.</div>
    </div>
    <div class="mb-2">
      <label class="form-label fw-semibold" for="su-confirm">Type the password again</label>
      <input id="su-confirm" class="form-control form-control-lg" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword" name="confirmPassword"
        (keydown.enter)="submit()" autocomplete="new-password" required>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" [(ngModel)]="showPassword" name="showPassword" id="showPassword">
      <label class="form-check-label" for="showPassword">Show my password</label>
    </div>

    @if (error) {
      <div class="alert alert-danger mb-3" role="alert">{{ error }}</div>
    }

    <button class="btn btn-danger btn-lg w-100 mb-2" [disabled]="busy" (click)="submit()">
      {{ busy ? 'Creating your account…' : 'Create my account' }}
    </button>
    <a class="btn btn-link w-100" routerLink="/login">I already have an account — sign in</a>
  </div>
</div>
