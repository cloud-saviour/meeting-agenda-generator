@if (club.isAppAdmin() && apologies.length) {
  <div class="card p-3 mb-3">
    <h3 class="section-title">Apologies — can't come ({{ apologies.length }})</h3>
    <div class="list-group list-group-flush">
      @for (a of apologies; track a.uid) {
        <div class="list-group-item d-flex flex-wrap align-items-center gap-2">
          <span class="flex-grow-1">
            <span class="fw-semibold">{{ a.name }}</span>
            <span class="text-muted"> · {{ a.joinedAt }}</span>
          </span>
          <button type="button" class="btn btn-outline-danger"
            [disabled]="isRemovePending(a.uid)" (click)="remove(a.uid, a.name)">
            {{ isRemovePending(a.uid) ? '…' : 'Remove' }}
          </button>
        </div>
      }
    </div>
    @if (removeError) {
      <div class="alert alert-danger mt-2 mb-0" role="alert">{{ removeError }}</div>
    }
  </div>
}
