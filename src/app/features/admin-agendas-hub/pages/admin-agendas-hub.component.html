<app-navbar title="Manage Agendas" [fixed]="true"
  [links]="[
    { label: '⚙ Manage Roles', path: '/admin/manage-roles' },
    { label: '🏠 Home', path: '/' }
  ]">
</app-navbar>

<div class="d-flex flex-column align-items-center" style="margin-top:32px;">
  <div class="d-flex flex-wrap justify-content-center gap-4 px-3" style="max-width:640px;">

    <div class="card text-center p-4 shadow-sm position-relative" style="width:278px;height:177px;">
      <div class="fs-1 mb-2">&#128221;</div>
      <h2 class="fs-6 fw-bold">Create New Plan</h2>
      <p class="text-muted small mb-0">Build a new agenda or continue editing the current one</p>
      <a [routerLink]="'/admin' | clubLink" class="stretched-link" aria-label="Open Create New Plan"></a>
    </div>

    <div class="card text-center p-4 shadow-sm position-relative" style="width:278px;height:177px;">
      <div class="fs-1 mb-2">&#128203;</div>
      <h2 class="fs-6 fw-bold">Open Recent Plans</h2>
      <p class="text-muted small mb-0">Open, review, or delete a previously saved agenda</p>
      <a [routerLink]="'/admin/agendas' | clubLink" class="stretched-link" aria-label="Open Recent Plans"></a>
    </div>

  </div>
</div>
