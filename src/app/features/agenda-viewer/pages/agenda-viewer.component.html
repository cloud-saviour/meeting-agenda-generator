<app-navbar title="Agenda Preview" [fixed]="true"
  [links]="[
    { label: '👥 Check in', path: '/checkin', queryParams: { meeting: meetingId } },
    { label: '🏠 Home', path: '/' }
  ]">
  <button class="btn btn-outline-light" [disabled]="refreshing" (click)="refresh()">
    {{ refreshing ? 'Refreshing…' : refreshError ? 'Could not refresh — tap to try again' : refreshed ? 'Up to date' : 'Refresh the agenda' }}
  </button>
</app-navbar>

<div>
  @if (found) {
    <div class="bg-body-secondary d-flex justify-content-center p-4">
      <app-agenda-preview></app-agenda-preview>
    </div>
  } @else {
    <div class="container text-center py-5" style="max-width:500px;">
      <p class="fs-5 text-muted">No agenda has been published for this meeting yet. Please check back closer to the meeting.</p>
    </div>
  }
</div>
