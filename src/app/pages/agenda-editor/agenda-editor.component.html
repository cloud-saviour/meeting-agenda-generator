<div class="d-flex flex-column vh-100 app-shell">

  <!-- APP BAR -->
  <nav class="navbar navbar-dark bg-dark d-print-none flex-shrink-0 d-flex align-items-center px-3 gap-2">
    <img src="logo.png" alt="Agora" height="30">
    <span class="navbar-brand mb-0 fs-6 fw-bold">Agora Agenda Creator</span>
    <div class="ms-auto d-flex align-items-center gap-2">
      <button class="btn btn-outline-light btn-sm" (click)="saveJSON()">&#128190; Export JSON</button>
      <button class="btn btn-outline-light btn-sm" (click)="loadJSON()">&#128193; Import JSON</button>
      <button class="btn btn-outline-light btn-sm" [disabled]="docxBusy" (click)="generateDocx()">
        {{ docxBusy ? 'Building…' : '⬇ DOCX' }}
      </button>
      <button class="btn btn-danger btn-sm" (click)="printAgenda()">&#128438; Print / PDF</button>
      <a class="btn btn-outline-light btn-sm" routerLink="/checkin">&#128101; Meeting Check-in</a>
      <a class="btn btn-outline-light btn-sm" routerLink="/admin/roles">&#9881; Manage Roles</a>
      <a class="btn btn-outline-light btn-sm" routerLink="/">&#127968; Home</a>
    </div>
  </nav>

  <div class="row g-0 flex-grow-1 app-body" style="min-height:0;">

    <!-- FORM PANEL -->
    <div class="col-12 col-md-4 col-lg-3 bg-white border-end overflow-auto d-print-none app-sidebar" style="min-height:0;">
      <div class="p-3 pb-4">
        <app-meeting-form></app-meeting-form>
        <app-agenda-items></app-agenda-items>
        <app-speakers-form></app-speakers-form>
        <app-committee-form></app-committee-form>
      </div>
    </div>

    <!-- PREVIEW PANEL -->
    <div class="col bg-body-secondary overflow-auto d-flex justify-content-center align-items-start p-4 app-preview" style="min-height:0;">
      <app-agenda-preview></app-agenda-preview>
    </div>

  </div>

</div>

<input type="file" id="jf" accept=".json" class="d-none" (change)="onImportJSON($event)">
