<div class="app-bar">
  <img src="logo.png" alt="Agora">
  <h1>Manage Meeting Roles</h1>
  <div class="sp"></div>
  <a class="btn" routerLink="/checkin">&#8592; Back to Check-in</a>
</div>

<div class="su-wrap" style="margin-top:64px;">

  <div class="su-section">
    <h3>Add a Role</h3>
    <div class="su-signup-form">
      <div class="f" style="margin:0;">
        <label>Label</label>
        <input type="text" [(ngModel)]="newLabel" name="newLabel" placeholder="e.g. Table Topics Master">
      </div>
      <div class="f" style="margin:0;">
        <label>Description (optional)</label>
        <input type="text" [(ngModel)]="newDescription" name="newDescription" placeholder="Shown to admins only">
      </div>
      <button class="badd" (click)="create()">+ Add Role</button>
    </div>
  </div>

  <div class="su-section">
    <h3>All Roles ({{ roles.length }})</h3>
    @for (r of roles; track r.id) {
      <div class="su-role-row" [class.archived]="!r.active">
        @if (r.active) {
          <span class="su-pill open">Active</span>
        } @else {
          <span class="su-pill archived">Archived</span>
        }

        @if (editingId === r.id) {
          <div class="su-signup-form" style="flex:1;margin:0;">
            <input type="text" [(ngModel)]="editLabel" name="editLabel" placeholder="Label">
            <input type="text" [(ngModel)]="editDescription" name="editDescription" placeholder="Description (optional)">
            <div style="display:flex;gap:6px;">
              <button class="su-claim-btn" (click)="saveEdit()">Save</button>
              <button class="su-release-btn" (click)="cancelEdit()">Cancel</button>
            </div>
          </div>
        } @else {
          <span class="su-role-name">
            {{ r.label }}
            @if (r.description) {
              <span class="su-role-desc">— {{ r.description }}</span>
            }
          </span>
          <button class="su-release-btn" (click)="startEdit(r.id, r.label, r.description)">Edit</button>
          @if (r.active) {
            <button class="su-release-btn" (click)="archive(r.id)">Archive</button>
          } @else {
            <button class="su-claim-btn" (click)="restore(r.id)">Restore</button>
          }
        }
      </div>
    }
  </div>

</div>
