<div class="sec">
  <div class="sec-t">Prepared Speakers</div>

  @for (s of spks; track s.id; let i = $index) {
    <div class="card">
      <div class="ch">
        <span class="cl">Speaker {{ i + 1 }}</span>
        <button class="brm" (click)="remove(s.id)">✕</button>
      </div>
      <div class="f">
        <label>Name</label>
        <input type="text" [value]="s.name" (input)="update(s.id, 'name', $any($event.target).value)">
      </div>
      <div class="g2">
        <div class="f">
          <label>Level</label>
          <input type="text" [value]="s.level" placeholder="e.g. L1 P1" (input)="update(s.id, 'level', $any($event.target).value)">
        </div>
        <div class="f">
          <label>Time (mins)</label>
          <div style="display:flex;gap:4px;align-items:center">
            <input type="number" min="1" max="60" [value]="s.timeLo" style="width:48px" (input)="update(s.id, 'timeLo', +$any($event.target).value)">
            <span>–</span>
            <input type="number" min="1" max="60" [value]="s.timeHi" style="width:48px" (input)="update(s.id, 'timeHi', +$any($event.target).value)">
          </div>
        </div>
      </div>
      <div class="f">
        <label>Title</label>
        <input type="text" [value]="s.title" (input)="update(s.id, 'title', $any($event.target).value)">
      </div>
      <div class="f">
        <label>Evaluator</label>
        <input type="text" [value]="s.evaluator" (input)="update(s.id, 'evaluator', $any($event.target).value)">
      </div>
    </div>
  }

  <button class="badd" (click)="add()">+ Add Speaker</button>
</div>
