<nav class="navbar navbar-dark bg-dark d-flex flex-wrap align-items-center px-3 gap-2"
     [class.sticky-top]="fixed"
     [class.flex-shrink-0]="!fixed"
     [class.d-print-none]="printHidden">
  <img src="logo.png" alt="Agora" height="30">
  <span class="navbar-brand mb-0 fs-5 fw-bold">{{ title }}</span>
  @if (currentUser(); as u) {
    <span class="text-light text-truncate" style="max-width:260px;" [title]="u.email">
      {{ u.displayName || u.email }}
    </span>
  }
  <div class="ms-auto d-flex flex-wrap align-items-center gap-2" [class.w-100]="menuOpen()">
    <button type="button" class="btn btn-outline-light d-md-none" [attr.aria-expanded]="menuOpen()" aria-controls="app-menu"
      (click)="toggleMenu()">{{ menuOpen() ? '✕ Close menu' : '☰ Menu' }}</button>

    <div id="app-menu" class="nav-menu flex-wrap align-items-center gap-2 d-md-flex"
      [class.d-none]="!menuOpen()" [class.d-flex]="menuOpen()" [class.w-100]="menuOpen()" [class.flex-column]="menuOpen()"
      [class.align-items-stretch]="menuOpen()">
      @for (item of menu(); track item.key) {
        <a class="btn btn-outline-light nav-link-item" [class.active]="active() === item.key"
          [attr.aria-current]="active() === item.key ? 'page' : null"
          [routerLink]="item.path" [queryParams]="item.queryParams">{{ item.label }}</a>
      }
      @if (currentUser()) {
        <button type="button" class="btn btn-outline-light" (click)="signOut()">🚪 Sign out</button>
      }
    </div>

    <ng-content></ng-content>
  </div>
</nav>
